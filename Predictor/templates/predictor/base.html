{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}House Price Prediction{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'predictor/css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark site-navbar">

            <a class="navbar-brand" href="{% url 'home' %}">House Price Prediction</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'predict' %}">Predict</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'history' %}">History</a></li>
